name: Tests

on: pull_request

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The test global setup connects with these credentials to create one
      # database set (test_<n>, chatbot_test_<n>, lti_test_<n>) per Jest worker.
      POSTGRES_USER: helpme
      POSTGRES_PASSWORD: mysecretpassword
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      CI: 'true'
    services:
      postgres:
        image: ankane/pgvector
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: helpme
          POSTGRES_PASSWORD: mysecretpassword
        # needed because the postgres container does not provide a healthcheck
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - name: Create server environment files
        run: |
          cp packages/server/postgres.env.example packages/server/postgres.env
          cp packages/server/.env.development packages/server/.env
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test
